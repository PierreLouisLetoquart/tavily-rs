[package]
name = "tavily"
version = "4.1.0"
edition = "2021"
authors = ["Pierre-Louis Létoquart <randlgint@proton.me>"]
description = "A tiny tool for calling Tavily's REST API in the simplest way!"
license = "MIT"
repository = "https://github.com/PierreLouisLetoquart/tavily-rs"
keywords = ["Tavily", "search-engine", "web-browser", "llm-search", "rag"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
] }
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["time"] }

[features]
default = ["rustls"]
## TLS through rustls (reqwest's default backend).
rustls = ["reqwest/rustls"]
## TLS through the platform's native library (OpenSSL, Schannel, Security.framework).
native-tls = ["reqwest/native-tls"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[[example]]
name = "basic_search"
path = "examples/basic_search.rs"

[[example]]
name = "advanced_search"
path = "examples/advanced_search.rs"

[[example]]
name = "basic_extract"
path = "examples/basic_extract.rs"

[[example]]
name = "advanced_extract"
path = "examples/advanced_extract.rs"

[[example]]
name = "llm_context"
path = "examples/llm_context.rs"

[[example]]
name = "crawl"
path = "examples/crawl.rs"

[[example]]
name = "map_then_extract"
path = "examples/map_then_extract.rs"

[[example]]
name = "custom_client"
path = "examples/custom_client.rs"
